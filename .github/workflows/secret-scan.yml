name: secret-scan
on:
  push:
    paths: ["collab/**", "workspace/**"]
  pull_request:
    paths: ["collab/**", "workspace/**"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed secrets or private keys
        run: |
          set -e
          # Real secret values must never enter this repo (only *.example templates).
          ! rg -N --no-messages -i 'BEGIN .*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{16,}|xox[bpas]-[A-Za-z0-9-]{8,}' collab workspace || (echo 'possible secret committed' && exit 1)
          ! rg -N --no-messages -E 'postgres(ql)?://[^/ ]+:[^@ ]+@' collab workspace --glob '!*.test.ts' || (echo 'possible DSN with password committed' && exit 1)
          # No real env files, dumps, or key material.
          ! git ls-files | rg -i '\.env$|\.env\.local|\.pem$|\.key$|\.dump$|service-account' || (echo 'blocked filename committed' && exit 1)
          echo 'secret scan clean'
